    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Apakah Gerakin gratis?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Versi web Gerakin tersedia untuk dicoba langsung. Rincian biaya dan paket belum diumumkan di halaman ini; jika ada pembaruan, informasinya akan ditampilkan melalui kanal resmi Gerakin."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah harus membuat akun?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ya. Buat akun dengan email dan kata sandi untuk masuk ke Beranda, menyimpan aktivitas, mengikuti tantangan, dan menyinkronkan profil. Sesi login ditangani dengan cookie HttpOnly."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah Gerakin membutuhkan GPS?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "GPS dipakai untuk lari, sepeda, jalan kaki, dan hiking agar rute terekam real-time. Tapi kamu tidak selalu membutuhkannya: ada mode demo 10× untuk mencoba alur tanpa GPS, serta input aktivitas manual untuk gym, renang, futsal, yoga, atau sesi tanpa GPS."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah Gerakin bisa dipakai untuk gym?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bisa. Catat sesi gym lewat input manual. Gerakin memakai istilah Tempo untuk irama repetisi, jadi fokus pencatatannya sesuai dengan latihanmu."
            }
          },
          {
            "@type": "Question",
            "name": "Di mana data Gerakin disimpan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aktivitas, kudos, komentar, klub, tantangan, dan profil pengguna disimpan di database PostgreSQL. Data kemudian disinkronkan dengan akun pengguna, sehingga riwayat tetap terhubung."
            }
          },
          {
            "@type": "Question",
            "name": "Kapan APK Gerakin tersedia?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "APK masih dalam tahap persiapan. Sementara itu, kamu bisa menggunakan web app untuk mencoba Gerakin. Tombol unduh akan diaktifkan saat APK siap dirilis."
            }
          },
          {
            "@type": "Question",
            "name": "Bisakah mencoba tanpa GPS?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tentu. Mode demo 10× mempercepat simulasi aktivitas tanpa GPS, dan input manual tersedia untuk sesi yang tidak memerlukan pelacakan rute."
            }
          }
        ]
